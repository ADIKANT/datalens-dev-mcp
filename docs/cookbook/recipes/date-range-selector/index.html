<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Copy-ready JavaScript visualization recipes and linked DataLens cases.">
  <title>JavaScript Visualization Cookbook · datalens-dev-mcp</title>
  <style>:root {
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --text: #101828;
  --muted: #667085;
  --border: #dfe4ec;
  --accent: #1769e0;
  --accent-soft: #eaf2ff;
  --code: #101828;
  --code-text: #e5e7eb;
  --shadow: 0 12px 32px rgba(15, 23, 42, .08);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 280px; background: var(--bg); color: var(--text); }
button, input { font: inherit; }
a { color: inherit; }
code { font-family: "SFMono-Regular", Consolas, monospace; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

#topbar {
  position: sticky; top: 0; z-index: 20; min-height: 72px; padding: 10px 20px;
  display: grid; grid-template-columns: minmax(230px, 1fr) auto minmax(60px, 1fr); align-items: center; gap: 18px;
  background: rgba(255,255,255,.96); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px);
}
.brand { display: flex; flex-direction: column; text-decoration: none; min-width: 0; }
.brand span { font-weight: 850; letter-spacing: -.02em; }
.brand small { margin-top: 2px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.primary-nav { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-soft); }
.primary-nav a { padding: 8px 13px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 750; text-decoration: none; }
.primary-nav a:hover, .primary-nav a.is-active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(15,23,42,.08); }
.language-toggle { justify-self: end; min-width: 44px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 12px; font-weight: 800; cursor: pointer; }

.site-shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100vh - 72px); }
#sidebar { position: sticky; top: 72px; height: calc(100vh - 72px); overflow: auto; padding: 20px 14px 40px; background: var(--surface); border-right: 1px solid var(--border); }
#sidebar > a, .side-group a { display: flex; flex-direction: column; gap: 3px; padding: 9px 10px; margin: 2px 0; border-radius: 8px; color: var(--muted); font-size: 13px; text-decoration: none; }
#sidebar a:hover, #sidebar a.is-active { background: var(--accent-soft); color: #174ea6; }
.side-title { padding: 0 10px 9px; font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.side-group { margin-top: 20px; }
.side-group h2 { margin: 0 10px 7px; color: var(--muted); font-size: 10px; line-height: 14px; letter-spacing: .12em; text-transform: uppercase; }
.side-group a code { color: var(--muted); font-size: 10px; }
.search { display: block; }
.search input { width: 100%; padding: 10px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-soft); color: var(--text); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(23,105,224,.12); }

#content { min-width: 0; padding: 32px clamp(18px, 4vw, 56px) 72px; }
.landing, .recipe, .case-page { width: min(1160px, 100%); margin: 0 auto; }
.hero { padding: 32px 0 38px; border-bottom: 1px solid var(--border); }
.kicker { display: inline-flex; gap: 6px; margin-bottom: 10px; color: var(--accent); font-size: 11px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
.hero h1, .recipe-header h1 { margin: 0; font-size: clamp(34px, 5vw, 58px); line-height: 1.02; letter-spacing: -.045em; }
.hero p, .recipe-header p { max-width: 780px; margin: 16px 0 0; color: var(--muted); font-size: 16px; line-height: 1.6; }

.tips-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
.tip-card, .info-card, .section-block, .preview-panel, .code-section, .edit-note { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
.tip-card { min-height: 210px; padding: 22px; }
.tip-card > span { color: var(--accent); font: 750 11px/1 monospace; }
.tip-card h2 { margin: 38px 0 9px; font-size: 20px; letter-spacing: -.02em; }
.tip-card p, .info-card p { margin: 0; color: var(--muted); line-height: 1.6; }

.card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 28px; }
.catalog-card { min-height: 220px; padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); text-decoration: none; transition: transform .16s ease, box-shadow .16s ease; }
.catalog-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.catalog-card > span { color: var(--accent); font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: .1em; }
.catalog-card h2 { margin: 28px 0 8px; font-size: 19px; }
.catalog-card p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
.catalog-card code { margin-top: auto; color: var(--muted); font-size: 10px; }
.case-list { display: grid; gap: 14px; margin-top: 28px; }
.case-card { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 18px; padding: 24px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); text-decoration: none; }
.case-card > span { color: var(--accent); font: 850 28px/1 monospace; }
.case-card h2 { margin: 0 0 7px; font-size: 24px; }
.case-card p { margin: 0 0 12px; color: var(--muted); }
.case-card code { color: var(--muted); font-size: 11px; }

.recipe-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
.recipe-header h1 { font-size: clamp(32px, 4vw, 50px); }
.outline-button { flex: 0 0 auto; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 12px; font-weight: 750; text-decoration: none; }
.preview-panel { padding: 16px; overflow: hidden; }
.preview-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.preview-heading h2, .section-block h2, .code-section h2, .info-card h2 { margin: 0; font-size: 15px; }
.preview-heading p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
.preview-switches, .section-heading > div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.segmented { display: inline-flex; padding: 3px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-soft); }
.segmented button { padding: 6px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
.segmented button.is-active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
.preview-mount { min-height: 220px; display: flex; align-items: flex-start; justify-content: center; overflow: auto; border-radius: 10px; background-color: #f6f8fb; background-image: linear-gradient(45deg,#edf0f4 25%,transparent 25%),linear-gradient(-45deg,#edf0f4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#edf0f4 75%),linear-gradient(-45deg,transparent 75%,#edf0f4 75%); background-size: 18px 18px; background-position: 0 0,0 9px,9px -9px,-9px 0; }
.preview-frame { display: block; flex: 0 0 auto; max-width: 100%; border: 1px solid var(--border); background: #fff; }
.two-column { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-top: 14px; }
.info-card { padding: 18px; }
.info-card p { margin-top: 8px; }
.section-block, .code-section { margin-top: 14px; padding: 18px; }
.edit-note { margin-top: 14px; padding: 14px 18px; background: var(--accent-soft); border-color: #cbdcff; }
.edit-note p { margin: 0; color: #174ea6; font-size: 13px; line-height: 1.5; }
.muted { color: var(--muted); }

.table-scroll { margin-top: 14px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 10px 11px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
td { line-height: 1.45; }
td small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
td code { white-space: nowrap; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.mode-label { color: var(--muted); font-size: 11px; }
.object-tabs { display: flex; gap: 8px; overflow: auto; margin: 14px 0 8px; padding-bottom: 4px; }
.object-tabs button { min-width: 150px; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); cursor: pointer; }
.object-tabs button code { color: var(--muted); font-size: 9px; }
.object-tabs button.is-active { border-color: var(--accent); background: var(--accent-soft); }

.code-tabs { display: flex; gap: 4px; margin-top: 14px; overflow: auto; }
.code-tabs button { padding: 8px 10px; border: 0; border-radius: 7px 7px 0 0; background: var(--surface-soft); color: var(--muted); font: 650 11px/1 monospace; cursor: pointer; white-space: nowrap; }
.code-tabs button.is-active { background: var(--code); color: var(--code-text); }
.code-toolbar { min-height: 44px; padding: 7px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--code); color: #98a2b3; border-radius: 0 8px 0 0; font-size: 11px; }
.code-toolbar > div { display: flex; gap: 5px; }
.code-toolbar button, .code-toolbar a { padding: 6px 8px; border: 1px solid #344054; border-radius: 6px; background: #1d2939; color: #e5e7eb; font-size: 10px; text-decoration: none; cursor: pointer; }
.code-section pre { max-height: 620px; margin: 0; padding: 16px; overflow: auto; border-radius: 0 0 8px 8px; background: var(--code); color: var(--code-text); font: 11px/1.6 "SFMono-Regular", Consolas, monospace; tab-size: 2; }

@media (max-width: 960px) {
  #topbar { grid-template-columns: 1fr auto; }
  .brand small { display: none; }
  .primary-nav { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; justify-content: center; }
  .site-shell { grid-template-columns: 210px minmax(0,1fr); }
  #sidebar { top: 110px; height: calc(100vh - 110px); }
  .card-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

@media (max-width: 720px) {
  #topbar { position: static; padding: 10px 12px; }
  .primary-nav { overflow: auto; justify-content: flex-start; }
  .site-shell { display: block; }
  #sidebar { position: static; width: 100%; height: auto; max-height: 260px; border-right: 0; border-bottom: 1px solid var(--border); }
  #content { padding: 24px 14px 54px; }
  .tips-grid, .card-grid, .two-column { grid-template-columns: 1fr; }
  .recipe-header, .preview-heading, .section-heading { flex-direction: column; }
  .preview-switches { width: 100%; justify-content: space-between; }
  .case-card { grid-template-columns: 42px minmax(0,1fr); padding: 18px; }
  .code-toolbar { align-items: flex-start; flex-direction: column; }
}
</style>
</head>

,"summary":{"en":"Relationship between two numeric measures.","ru":"Связь двух числовых показателей."},"title":{"en":"Scatter plot","ru":"Точечная диаграмма"},"variant":"scatter"},{"family":"bubble","group":"relationship","route":"editor_advanced","slug":"bubble","summary":{"en":"An x/y relationship with a third measure encoded by size.","ru":"Связь x/y с третьим показателем в размере."},"title":{"en":"Bubble chart","ru":"Пузырьковая диаграмма"},"variant":"bubble"},{"family":"pie","group":"part","route":"editor_advanced","slug":"pie","summary":{"en":"Parts of one whole in a circular form.","ru":"Части одного целого в круговой форме."},"title":{"en":"Pie chart","ru":"Круговая диаграмма"},"variant":"pie"},{"family":"donut","group":"part","route":"editor_advanced","slug":"donut","summary":{"en":"Part-to-whole composition with a center total.","ru":"Состав целого с итогом в центре."},"title":{"en":"Donut chart","ru":"Кольцевая диаграмма"},"variant":"donut"},{"family":"treemap","group":"part","route":"editor_advanced","slug":"treemap","summary":{"en":"Rectangle area is proportional to parts of a whole.","ru":"Площадь прямоугольников пропорциональна частям целого."},"title":{"en":"Treemap","ru":"Иерархическая карта"},"variant":"treemap"},{"family":"table_node","group":"table","route":"editor_table","slug":"editor-table","summary":{"en":"A native table with a bar cell and pagination.","ru":"Нативная таблица с bar-ячейкой и пагинацией."},"title":{"en":"Compact table","ru":"Компактная таблица"},"variant":"standard"},{"family":"table_node","group":"table","route":"editor_table","slug":"detail-table","summary":{"en":"Pinned keys, formats, hints, pagination, and horizontal scrolling.","ru":"Закреплённые ключи, форматы, hints, пагинация и горизонтальная прокрутка."},"title":{"en":"Wide detail table","ru":"Широкая детальная таблица"},"variant":"detail"},{"family":"table_node","group":"table","route":"editor_table","slug":"status-table","summary":{"en":"Conditional styling, a safe id":"javascript_cookbook","tips":[{"body":{"en":"Copy an object's tabs in the shown order. A normal transfer requires changes only in Meta and Sources; Params, Prepare, Controls, and Config already match the recipe contract.","ru":"Копируйте вкладки объекта в указанном порядке. Для обычного переноса обязательные изменения находятся только в Meta и Sources; Params, Prepare, Controls и Config уже согласованы с контрактом рецепта."},"id":"copy-order","title":{"en":"Which tabs to copy","ru":"Какие вкладки копировать"}},{"body":{"en":"Field names emitted by Sources are the interface between data and Prepare. Map your fields to them, but do not rename aliases unless you intentionally update Prepare too.","ru":"Имена полей после Sources — это интерфейс между данными и Prepare. Сопоставьте с ними свои поля, но не переименовывайте aliases без одновременного осознанного изменения Prepare."},"id":"aliases","title":{"en":"Preserve output aliases","ru":"Сохраните выходные псевдонимы"}},{"body":{"en":"Optional settings live in the CUSTOMIZE block before the protected runtime. Change only values in that block: series labels, palette, number format, units, and tooltip copy.","ru":"Необязательные настройки собраны в блоке CUSTOMIZE перед защищённым runtime. Меняйте только значения этого блока: подписи серий, палитру, формат чисел, единицы и текст tooltip."},"id":"customize","title":{"en":"Labels, colors, units, and tooltip","ru":"Подписи, цвета, единицы и всплывающие подсказки"}},{"body":{"en":"The renderer receives the actual width and height. Narrow cards reduce padding and label density; wide cards show more direct labels. Recheck all three modes after changing fonts or legends.","ru":"Рендер получает фактические width и height. На узкой карточке уменьшаются отступы и плотность подписей; на широкой появляется больше прямых подписей. Проверяйте все три режима после изменения шрифтов или легенды."},"id":"responsive","title":{"en":"Compact, dashboard, and wide","ru":"Компактный, дашборд и широкий режим"}},{"body":{"en":"For wide tables, keep key columns pinned, enable horizontal scrolling, and bound the page with pagination. Do not recreate table_node in Advanced HTML: the native table preserves sorting, cell types, and accessibility.","ru":"Для широких таблиц оставляйте ключевые колонки закреплёнными, включайте горизонтальную прокрутку и ограничивайте страницу пагинацией. Не переносите table_node в Advanced HTML: нативная таблица сохраняет сортировку, типы ячеек и доступность."},"id":"tables","title":{"en":"Wide tables","ru":"Широкие таблицы"}},{"body":{"en":"Send already aggregated rows to a visualization. A dataset is convenient for reuse and field governance; SQL pushdown is useful at larger scale when ClickHouse should filter and aggregate before returning the result.","ru":"Передавайте в визуализацию уже агрегированные строки. Dataset удобен для повторного использования и управления полями; SQL pushdown полезен для больших объёмов, когда фильтрацию и агрегацию выгоднее выполнить в ClickHouse до передачи результата."},"id":"scale","title":{"en":"Data scaling","ru":"Масштабирование данных"}},{"body":{"en":"First compare Sources aliases with the contract and check value types. Then confirm required fields are not null, dates use ISO format, and Params filters still leave rows.","ru":"Сначала сравните aliases в Sources с контрактом и проверьте типы значений. Затем убедитесь, что обязательные поля не null, даты имеют ISO-формат, а фильтры Params действительно оставляют строки."},"id":"diagnostics","title":{"en":"When preview is empty","ru":"Если предпросмотр пустой"}}],"viewports":{"compact":{"height":220,"width":320},"dashboard":{"height":340,"width":640},"wide":{"height":460,"width":960}}}</script>
  <script>(() => {
  'use strict';

  const payload = JSON.parse(document.getElementById('cookbook-data').textContent);
  const base = document.body.dataset.base || './';
  const query = new URLSearchParams(window.location.search);
  const state = {
    lang: query.get('lang') === 'en' ? 'en' : 'ru',
    theme: 'light',
    viewport: 'dashboard',
    tab: '',
    filter: '',
    sourceMode: 'dataset',
    caseObject: '',
  };

  const ui = {
    ru: {
      tips: 'Советы', library: 'Визуализации', cases: 'Кейсы применения',
      subtitle: 'Готовые типизированные рецепты JavaScript для DataLens Editor',
      search: 'Найти визуализацию', preview: 'Интерактивный предпросмотр',
      synthetic: 'Синтетический локальный предпросмотр — не доказательство рендера в опубликованном DataLens',
      useCase: 'Когда использовать', behavior: 'Особенности поведения',
      sourceContract: 'Контракт Sources', alias: 'Alias', meaning: 'Назначение',
      typeFormat: 'Тип / формат', nullBehavior: 'Поведение null', example: 'Пример',
      noSource: 'Внешний источник не требуется.', code: 'Код для DataLens', support: 'Вспомогательные файлы',
      copy: 'Копировать', copied: 'Скопировано', open: 'Открыть исходник', download: 'Скачать',
      markdown: 'Markdown', parameterMap: 'Карта параметров', owner: 'Владелец', readers: 'Читатели',
      type: 'Тип', defaultValue: 'По умолчанию', purpose: 'Назначение', copyOrder: 'Объекты и порядок копирования',
      dataset: 'Dataset', clickhouse: 'ClickHouse', sourceMode: 'Режим Sources',
      emptyLibrary: 'Ничего не найдено', allRecipes: 'Все 34 самостоятельных рецепта',
      linkedCases: 'Три примера, где селекторы, чарты и таблицы используют общие Params.',
      previewError: 'Не удалось построить предпросмотр', object: 'Объект', tabs: 'Вкладки',
      whatChanges: 'Для обычного переноса замените только Meta и Sources. Необязательные настройки находятся в блоке CUSTOMIZE.',
      groups: {kpi: 'Показатели', time: 'Временные ряды', category: 'Сравнение категорий', matrix: 'Матрицы', flow: 'Потоки', distribution: 'Распределения', relationship: 'Связи', part: 'Части целого', table: 'Таблицы', selector: 'Селекторы'},
      viewports: {compact: 'Компактный', dashboard: 'Дашборд', wide: 'Широкий'},
      themes: {light: 'Светлая', dark: 'Тёмная'},
    },
    en: {
      tips: 'Tips', library: 'Visualizations', cases: 'Use cases',
      subtitle: 'Copy-ready typed JavaScript recipes for DataLens Editor',
      search: 'Find a visualization', preview: 'Interactive preview',
      synthetic: 'Synthetic local preview — not proof of rendering in published DataLens',
      useCase: 'When to use it', behavior: 'Specific behavior',
      sourceContract: 'Sources contract', alias: 'Alias', meaning: 'Purpose',
      typeFormat: 'Type / format', nullBehavior: 'Null behavior', example: 'Example',
      noSource: 'No external source is required.', code: 'DataLens code', support: 'Support files',
      copy: 'Copy', copied: 'Copied', open: 'Open source', download: 'Download',
      markdown: 'Markdown', parameterMap: 'Parameter map', owner: 'Owner', readers: 'Readers',
      type: 'Type', defaultValue: 'Default', purpose: 'Purpose', copyOrder: 'Objects and copy order',
      dataset: 'Dataset', clickhouse: 'ClickHouse', sourceMode: 'Sources mode',
      emptyLibrary: 'Nothing found', allRecipes: 'All 34 standalone recipes',
      linkedCases: 'Three examples where selectors, charts, and tables share Params.',
      previewError: 'Preview could not be built', object: 'Object', tabs: 'Tabs',
      whatChanges: 'For a normal transfer, replace only Meta and Sources. Optional settings live in the CUSTOMIZE block.',
      groups: {kpi: 'KPI', time: 'Time series', category: 'Category comparison', matrix: 'Matrices', flow: 'Flows', distribution: 'Distributions', relationship: 'Relationships', part: 'Part to whole', table: 'Tables', selector: 'Selectors'},
      viewports: {compact: 'Compact', dashboard: 'Dashboard', wide: 'Wide'},
      themes: {light: 'Light', dark: 'Dark'},
    },
  };

  function t(key) { return ui[state.lang][key]; }
  function localized(value) { return value && typeof value === 'object' ? value[state.lang] : String(value || ''); }
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function link(path) { return `${base}${path}${path.includes('?') ? '&' : '?'}lang=${state.lang}`; }
  function currentLangUrl() {
    const url = new URL(window.location.href);
    url.searchParams.set('lang', state.lang);
    return url;
  }

  function renderTopbar() {
    document.documentElement.lang = state.lang;
    document.getElementById('topbar').innerHTML = `
      <a class="brand" href="${link('index.html')}">
        <span>JavaScript Visualization Cookbook</span><small>${esc(t('subtitle'))}</small>
      </a>
      <nav class="primary-nav" aria-label="Cookbook">
        <a class="${payload.page_type === 'tips' ? 'is-active' : ''}" href="${link('index.html')}">${esc(t('tips'))}</a>
        <a class="${['library', 'recipe'].includes(payload.page_type) ? 'is-active' : ''}" href="${link('visualizations/index.html')}">${esc(t('library'))}</a>
        <a class="${['cases_index', 'case'].includes(payload.page_type) ? 'is-active' : ''}" href="${link('cases/index.html')}">${esc(t('cases'))}</a>
      </nav>
      <button id="language-toggle" class="language-toggle" type="button">${state.lang === 'ru' ? 'EN' : 'RU'}</button>
    `;
    document.getElementById('language-toggle').addEventListener('click', () => {
      state.lang = state.lang === 'ru' ? 'en' : 'ru';
      window.history.replaceState({}, '', currentLangUrl());
      state.tab = '';
      render();
    });
  }

  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (payload.page_type === 'tips') {
      sidebar.innerHTML = `<div class="side-title">${esc(t('tips'))}</div>${payload.tips.map(item => `<a href="#${esc(item.id)}">${esc(localized(item.title))}</a>`).join('')}`;
      return;
    }
    if (payload.page_type === 'cases_index' || payload.page_type === 'case') {
      sidebar.innerHTML = `<div class="side-title">${esc(t('cases'))}</div>${payload.cases.map(item => `<a class="${payload.case && payload.case.slug === item.slug ? 'is-active' : ''}" href="${link(`cases/${item.slug}/index.html`)}">${esc(localized(item.title))}</a>`).join('')}`;
      return;
    }
    const groups = [...new Set(payload.recipes.map(item => item.group))];
    sidebar.innerHTML = `
      <label class="search"><span class="sr-only">${esc(t('search'))}</span><input id="recipe-search" value="${esc(state.filter)}" placeholder="${esc(t('search'))}"></label>
      <div id="recipe-links"></div>
    `;
    const renderLinks = () => {
      const needle = state.filter.trim().toLowerCase();
      document.getElementById('recipe-links').innerHTML = groups.map(group => {
        const items = payload.recipes.filter(item => item.group === group && (!needle || `${item.family} ${localized(item.title)} ${localized(item.summary)}`.toLowerCase().includes(needle)));
        if (!items.length) return '';
        return `<section class="side-group"><h2>${esc(t('groups')[group] || group)}</h2>${items.map(item => `<a class="${payload.recipe && payload.recipe[state.lang].slug === item.slug ? 'is-active' : ''}" href="${link(`recipes/${item.slug}/index.html`)}"><span>${esc(localized(item.title))}</span><code>${esc(item.family)}</code></a>`).join('')}</section>`;
      }).join('') || `<p class="muted">${esc(t('emptyLibrary'))}</p>`;
    };
    renderLinks();
    document.getElementById('recipe-search').addEventListener('input', event => { state.filter = event.target.value; renderLinks(); });
  }

  function renderTips() {

      function factor(){return 1+((confirmed.category||[]).length?0.18:0)+((confirmed.status||[]).length?0.11:0)}
      function rowsFor(role){const f=factor();if(payload.kind==='period_comparison'){if(role==='kpi')return[{current_value:Math.round((118+days()*.7)*10)/10,comparator_value:Math.round((108+days()*.55)*10)/10}];if(role==='trend'){const s=step();const count=s==='day'?7:s==='week'?8:6;const current=payload.lang==='ru'?'Текущий период':'Current period';const comparison=payload.lang==='ru'?'Сравнение':'Comparison';return Array.from({length:count},(_,index)=>[{bucket:s+' '+(index+1),metric:current,value:42+index*5+(index%3)*3},{bucket:s+' '+(index+1),metric:comparison,value:38+index*4+(index%2)*2}]).flat()}}
        if(payload.kind==='filters_detail'){if(role==='summary'){const cur=payload.lang==='ru'?'Текущий':'Current';const cmp=payload.lang==='ru'?'Сравнение':'Comparison';return['A','B','C'].flatMap((label,index)=>[{label:'Category '+label,group:cur,value:Math.round((72-index*14)*f)},{label:'Category '+label,group:cmp,value:Math.round((63-index*12)*f)}])}if(role==='detail')return Array.from({length:6},(_,index)=>({entity_id:'OBJ-'+(1042+index),entity_name:(payload.lang==='ru'?'Объект ':'Object ')+(1042+index),status:index%3?'ready':'warning',owner:index%2?(payload.lang==='ru'?'Команда A':'Team A'):null,updated_at:'2026-01-'+String(10+index).padStart(2,'0')+'T12:30:00Z',amount:Math.round((780+index*135)*f)}))}
        if(payload.kind==='status_monitoring'){if(role==='kpi')return[{current_value:Math.round(128*f)}];if(role==='heatmap'){const xs=payload.lang==='ru'?['Пн','Вт','Ср']:['Mon','Tue','Wed'];const ys=payload.lang==='ru'?['Утро','Вечер']:['Morning','Evening'];return ys.flatMap((group,y)=>xs.map((label,x)=>({label,group,value:Math.round((18+x*13+y*27)*f),target:0})))}if(role==='status_table')return Array.from({length:5},(_,index)=>({entity_id:'CHK-'+(201+index),item:(payload.lang==='ru'?'Проверка ':'Check ')+(index+1),status:index%3===0?'warning':'ready',updated_at:'2026-01-'+String(15+index).padStart(2,'0')+'T10:00:00Z',details_url:'https://example.invalid/item/'+(201+index)}))}return[]}
      function renderControlsObject(object){loadedRows=[];const exported=execute(object.tabs['controls.js'],Editor);const controls=exported.controls||[];const mount=document.createElement('div');mount.className='case-controls';mount.innerHTML='<div class="controls">'+controls.map((control,index)=>{if(control.type==='range-datepicker')return '<div class="control" style="width:'+escapeHtml(control.width||'94%')+'"><label>'+escapeHtml(control.label)+'</label><span style="display:flex;gap:6px"><input data-range="from" type="date" value="'+escapeHtml(draft.from)+'"><input data-range="to" type="date" value="'+escapeHtml(draft.to)+'"></span></div>';const options=(control.content||[]).map(item=>'<option value="'+escapeHtml(item.value)+'" '+((confirmed[control.param]||[]).includes(item.value)?'selected':'')+'>'+escapeHtml(item.title)+'</option>').join('');return '<div class="control" style="width:'+escapeHtml(control.width||'46%')+'"><label>'+escapeHtml(control.label)+'</label><select data-control="'+index+'" '+(control.multiselect?'multiple':'')+'>'+options+'</select></div>'}).join('')+'</div>';mount.querySelectorAll('[data-range]').forEach(input=>input.addEventListener('input',()=>{draft[input.dataset.range]=input.value;if(/^\\d{4}-\\d{2}-\\d{2}$/.test(draft.from)&&/^\\d{4}-\\d{2}-\\d{2}$/.test(draft.to)&&draft.from<=draft.to){confirmed.dateFrom=[draft.from];confirmed.dateTo=[draft.to];renderVisuals()}}));mount.querySelectorAll('[data-control]').forEach(select=>select.addEventListener('change',()=>{const control=controls[Number(select.dataset.control)];const values=select.multiple?[...select.selectedOptions].map(item=>item.value).filter(Boolean):[select.value].filter(Boolean);confirmed[control.param]=values;renderVisuals()}));root.appendChild(mount)}
      function renderVisuals(){const widgets=root.querySelector('.case-widgets');if(!widgets)return;widgets.innerHTML='';payload.objects.filter(item=>item.role!=='controls').forEach(object=>{const shell=document.createElement('section');shell.className='case-widget';shell.dataset.route=object.route;shell.innerHTML='<h2>'+escapeHtml(object.title)+'</h2><div></div>';const mount=shell.lastElementChild;const tooltip=document.createElement('div');tooltip.className='tooltip';shell.appendChild(tooltip);try{loadedRows=sourceEvents(object.source_contract,rowsFor(object.role));renderRoute(object.route,object.tabs,payload.width,Math.max(180,payload.height-34),Editor,mount,tooltip)}catch(error){mount.innerHTML='<div class="error">'+escapeHtml(payload.error_label+': '+(error&&error.message||error))+'</div>'}widgets.appendChild(shell)})}
      try{const controls=payload.objects.find(item=>item.role==='controls');if(controls)renderControlsObject(controls);const widgets=document.createElement('div');widgets.className='case-widgets';root.appendChild(widgets);renderVisuals()}catch(error){root.innerHTML='<div class="error">'+escapeHtml(payload.error_label+': '+(error&&error.message||error))+'</div>'}})();
    <\/script></body></html>`;
  }

  function render() {
    renderTopbar(); renderSidebar();
    if (payload.page_type === 'tips') renderTips();
    else if (payload.page_type === 'library') renderLibrary();
    else if (payload.page_type === 'cases_index') renderCasesIndex();
    else if (payload.page_type === 'recipe') renderRecipe();
    else if (payload.page_type === 'case') renderCase();
  }

  render();
})();
</script>
