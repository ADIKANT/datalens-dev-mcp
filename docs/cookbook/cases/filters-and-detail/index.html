AF8', '#D92D20'],\n  numberFormat: 'decimal1',\n  unit: '',\n  emptyLabel: \"Нет данных\",\n});\n\nconst params = Editor.getParams ? (Editor.getParams() || {}) : {};\nconst rawVariant = Array.isArray(params.table_variant) ? params.table_variant[0] : params.table_variant;\nconst TABLE_VARIANT = ['standard', 'detail', 'status', 'grouped_summary'].includes(String(rawVariant))\n  ? String(rawVariant)\n  : 'standard';\nconst THEME = {\n  text: 'var(--g-color-text-primary, inherit)',\n  textSecondary: 'var(--g-color-text-secondary, inherit)',\n  cellBg: 'var(--g-color-base-background, transparent)',\n  headerBg: 'var(--g-color-base-neutral-light, transparent)',\n  positiveBg: 'var(--g-color-base-positive-light, transparent)',\n  warningBg: 'var(--g-color-base-warning-light, transparent)',\n  dangerBg: 'var(--g-color-base-danger-light, transparent)',\n};\nconst HEADER_CSS = {'background-color': THEME.headerBg, color: THEME.text, 'font-weight': 'normal', 'text-align': 'left'};\nconst BODY_CSS = {color: THEME.text, 'background-color': THEME.cellBg};\nconst TABLE_COPY = Object.freeze({\n  noData: 'Нет данных', checkSources: 'Проверьте sources.js', identifier: 'Идентификатор', object: 'Объект',\n  status: 'Статус', owner: 'Владелец', updated: 'Обновлено', amount: 'Сумма', details: 'Подробнее',\n  item: 'Строка', category: 'Категория', completion: 'Выполнение', completed: 'Выполнено', total: 'Всего', progress: 'Прогресс', open: 'Открыть',\n  ready: 'Готово', warning: 'Требует внимания', review: 'На проверке', error: 'Ошибка', failed: 'Не выполнено', unknown: 'Неизвестно',\n});\n\nfunction tableObjects(sourceName) {\n  const loaded = Editor.getLoadedData() || {};\n  const source = loaded[sourceName] || [];\n  const metadata = Array.isArray(source) ? source.find((item) => item && item.event === 'metadata') : null;\n  const names = metadata?.data?.names || [];\n  return (Array.isArray(source) ? source : [])\n    .filter((item) => item && item.event === 'row')\n    .map((item) => Object.fromEntries(names.map((name, index) => [name, item.data[index]])));\n}\n\nfunction safeHttps(value) {\n  const text = String(value || '').trim();\n  return /^https:\\/\\/[^\\s]+$/i.test(text) ? text : '';\n}\n\nfunction formattedNumber(value) {\n  if (value === null || value === undefined || value === '' || !Number.isFinite(Number(value))) return '—';\n  return new Intl.NumberFormat('en-US', {maximumFractionDigits: 2}).format(Number(value));\n}\n\nfunction statusCss(value) {\n  const key = String(value || '').toLowerCase();\n  const background = key === 'ready' || key === 'ok'\n    ? THEME.positiveBg\n    : key === 'warning' || key === 'review'\n      ? THEME.warningBg\n      : key === 'error' || key === 'failed'\n        ? THEME.dangerBg\n        : THEME.cellBg;\n  return {...BODY_CSS, 'background-color': background, 'font-weight': '600'};\n}\n\nfunction statusLabel(value) {\n  const key = String(value || '').toLowerCase();\n  return TABLE_COPY[key] || TABLE_COPY.unknown;\n}\n\nconst objects = tableObjects('rows');\nlet head = [];\nlet rows = [];\n\nif (TABLE_VARIANT === 'detail') {\n  head = [\n    {id: 'entity_id', name: TABLE_COPY.identifier, type: 'text', pinned: true, width: 126, hint: 'Стабильный ключ строки', css: HEADER_CSS},\n    {id: 'entity_name', name: TABLE_COPY.object, type: 'text', pinned: true, width: 220, hint: 'Основное название', css: HEADER_CSS},\n    {id: 'status', name: TABLE_COPY.status, type: 'status', width: 120, css: HEADER_CSS},\n    {id: 'owner', name: TABLE_COPY.owner, type: 'text', width: 160, css: HEADER_CSS},\n    {id: 'updated_at', name: TABLE_COPY.updated, type: 'datetime', width: 170, hint: 'Исходное значение ISO-8601', css: HEADER_CSS},\n    {id: 'amount', name: TABLE_COPY.amount, type: 'number', width: 140, css: HEADER_CSS},\n  ];\n  rows = objects.filter((item) => item.entity_id).map((item, index) => ({\n    id: String(item.entity_id || `row_${index + 1}`),\n    cells: [\n      {value: item.entity_id, css: BODY_CSS},\n      {value: item.entity_name || item.entity_id, css: BODY_CSS},\n      {value: item.status || '', formattedValue: statusLabel(item.status), css: statusCss(item.status)},\n      {value: item.owner || '—', css: BODY_CSS},\n      {value: item.updated_at || TABLE_COPY.noData, css: BODY_CSS},\n      {value: item.amount, formattedValue: formattedNumber(item.amount), css: BODY_CSS},\n    ],\n  }));\n} else if (TABLE_VARIANT === 'status') {\n  head = [\n    {id: 'entity_id', name: TABLE_COPY.identifier, type: 'text', pinned: true, width: 126, css: HEADER_CSS},\n    {id: 'item', name: TABLE_COPY.item, type: 'text', width: 260, css: HEADER_CSS},\n    {id: 'status', name: TABLE_COPY.status, type: 'status', width: 140, css: HEADER_CSS},\n    {id: 'updated_at', name: TABLE_COPY.updated, type: 'datetime', width: 180, css: HEADER_CSS},\n    {id: 'details_url', name: TABLE_COPY.details, type: 'link', width: 100, css: HEADER_CSS},\n  ];\n  rows = objects.filter((item) => item.entity_id).map((item, index) => {\n    const href = safeHttps(item.details_url);\n    return {\n      id: String(item.entity_id || `row_${index + 1}`),\n      cells: [\n        {value: item.entity_id, css: BODY_CSS},\n        {value: item.item || item.entity_id, css: BODY_CSS},\n        {value: item.status || '', formattedValue: statusLabel(item.status), css: statusCss(item.status)},\n        {value: item.updated_at || TABLE_COPY.noData, css: BODY_CSS},\n        {value: href, href, formattedValue: href ? TABLE_COPY.open : '—', css: BODY_CSS},\n      ],\n    };\n  });\n} else if (TABLE_VARIANT === 'grouped_summary') {\n  head = [\n    {id: 'category', name: TABLE_COPY.category, type: 'text', pinned: true, width: 220, css: HEADER_CSS},\n    {id: 'completion', name: TABLE_COPY.completion, sub: [\n      {id: 'completed', name: TABLE_COPY.completed, type: 'bar', min: 0, max: Math.max(1, ...objects.map((item) => Number(item.total) || 0)), barColor: '#2B75E2', showLabel: true, css: HEADER_CSS},\n      {id: 'total', name: TABLE_COPY.total, type: 'number', css: HEADER_CSS},\n      {id: 'progress', name: TABLE_COPY.progress, type: 'progress', min: 0, max: 100, barColor: '#008A91', showLabel: true, css: HEADER_CSS},\n    ]},\n  ];\n  rows = objects.filter((item) => item.category).map((item, index) => {\n    const completed = Math.max(0, Number(item.completed) || 0);\n    const total = Math.max(0, Number(item.total) || 0);\n    const progress = total > 0 ? Math.min(100, completed / total * 100) : 0;\n    return {id: `row_${index + 1}`, cells: [\n      {value: item.category, css: BODY_CSS},\n      {value: completed, formattedValue: formattedNumber(completed), css: BODY_CSS},\n      {value: total, formattedValue: formattedNumber(total), css: BODY_CSS},\n      {value: progress, formattedValue: `${Math.round(progress)}%`, css: BODY_CSS},\n    ]};\n  });\n} else {\n  const names = ['status', 'item', 'value'];\n  const maximum = Math.max(1, ...objects.map((item) => Number(item.value) || 0));\n  head = [\n    {id: 'status', name: TABLE_COPY.status, type: 'status', css: HEADER_CSS},\n    {id: 'item', name: TABLE_COPY.item, type: 'text', css: HEADER_CSS},\n    {id: 'value', name: 'Значение', type: 'bar', min: 0, max: maximum, barColor: '#2B75E2', barHeight: '70%', showLabel: true, css: HEADER_CSS},\n  ];\n  rows = objects.map((item, index) => ({id: `row_${index + 1}`, cells: names.map((name) => ({value: item[name] ?? '', formattedValue: name === 'status' ? statusLabel(item[name]) : undefined, css: name === 'status' ? statusCss(item[name]) : BODY_CSS}))}));\n}\n\nif (!rows.length) {\n  const leafCount = head.reduce((count, item) => count + (Array.isArray(item.sub) ? item.sub.length : 1), 0);\n  rows = [{id: 'empty', cells: Array.from({length: leafCount}, (_unused, index) => ({value: index === 0 ? TABLE_COPY.noData : index === 1 ? TABLE_COPY.checkSources : '', css: BODY_CSS}))}];\n}\n\nmodule.exports = {head, rows, tableVariant: TABLE_VARIANT};\n","sources.js":"/**\n * Обязательная точка изменения: подключите свой источник и сохраните документированные выходные aliases.\n * Route: editor_table. Технические имена параметров и aliases оставлены без перевода.\n */\nconst {buildSource} = require('libs/dataset/v2');\n\nmodule.exports = {\n  rows: buildSource({\n    datasetId: Editor.getId('dataset'),\n    columns: [\"entity_id\", \"entity_name\", \"status\", \"owner\", \"updated_at\", \"amount\"],\n  }),\n};\n"}},"source_contract":[{"alias":"entity_id","example":"OBJ-1042","format":"stable identifier","key":"entity_id","meaning":"Стабильный идентификатор строки","null_behavior":"Строка отбрасывается","nullable":false,"type":"string"},{"alias":"entity_name","example":"Объект 1042","format":"display text","key":"entity_name","meaning":"Название объекта","null_behavior":"Показывается entity_id","nullable":false,"type":"string"},{"alias":"status","example":"ready","format":"status key","key":"status","meaning":"Технический ключ состояния","null_behavior":"Используется нейтральное оформление","nullable":false,"type":"string"},{"alias":"owner","example":"Команда A","format":"display text","key":"owner","meaning":"Ответственный владелец","null_behavior":"Показывается тире","nullable":true,"type":"string"},{"alias":"updated_at","example":"2026-01-05T12:30:00Z","format":"ISO-8601 datetime","key":"updated_at","meaning":"Время последнего изменения","null_behavior":"Показывается «нет данных»","nullable":true,"type":"string"},{"alias":"amount","example":1250.5,"format":"finite number","key":"amount","meaning":"Числовая сумма для форматирования","null_behavior":"Показывается тире","nullable":true,"type":"number"}],"title":"Детальная таблица"}},"recipe":"detail-table","role":"detail","route":"editor_table"}],"params":[{"default":["2026-01-01"],"name":"dateFrom","owner":"filters","purpose":{"en":"Period start","ru":"Начало периода"},"readers":["summary","detail"],"type":"ISO date"},{"default":["2026-01-30"],"name":"dateTo","owner":"filters","purpose":{"en":"Period end","ru":"К ента на объёме."},"title":{"en":"Area chart","ru":"График с заливкой"},"variant":"area"},{"family":"line_chart","group":"time","route":"editor_advanced","slug":"cumulative-line","summary":{"en":"Prepare sorts intervals and calculates a running total.","ru":"Prepare сортирует интервалы и рассчитывает накопительный итог."},"title":{"en":"Cumulative line","ru":"Накопительная линия"},"variant":"cumulative"},{"family":"vertical_bar_time_bucket","group":"time","route":"editor_advanced","slug":"vertical-bar-time-bucket","summary":{"en":"A discrete comparison of consecutive time intervals.","ru":"Дискретное сравнение последовательных временных интервалов."},"title":{"en":"Bars by time interval","ru":"Столбцы по периодам"},"variant":"time_bars"},{"family":"combo_time_series_combo","group":"time","route":"editor_advanced","slug":"combo-time-series","summary":{"en":"Bars and a line in one coordinate system.","ru":"Столбцы и линия в общей системе координат."},"title":{"en":"Combined time series","ru":"Комбинированный временной график"},"variant":"combo"},{"family":"horizontal_bar","group":"category","route":"editor_advanced","slug":"horizontal-bar","summary":{"en":"A sorted category comparison with direct values.","ru":"Отсортированное сравнение категорий с прямыми значениями."},"title":{"en":"Horizontal ranking","ru":"Горизонтальный рейтинг"},"variant":"ranking"},{"family":"grouped_bar","group":"category","route":"editor_advanced","slug":"grouped-bar","summary":{"en":"Multiple series inside shared categories.","ru":"Несколько рядов внутри общих категорий."},"title":{"en":"Grouped horizontal bars","ru":"Сгруппированные горизонтальные столбцы"},"variant":"grouped"},{"family":"stacked_100","group":"category","route":"editor_advanced","slug":"stacked-100","summary":{"en":"Part-to-whole composition in percentages.","ru":"Состав целого в процентах."},"title":{"en":"100% stacked","ru":"Столбцы с нормировкой до 100%"},"variant":"stacked_100"},{"family":"bullet_assignees","group":"category","route":"editor_advanced","slug":"bullet-actual-target","summary":{"en":"An actual value with a separate target marker.","ru":"Фактическое значение с отдельным целевым маркером."},"title":{"en":"Bullet: actual and target","ru":"Факт и цель"},"variant":"bullet"},{"family":"heatmap","group":"matrix","route":"editor_advanced","slug":"matrix-heatmap","summary":{"en":"Intensity at the intersection of two categorical coordinates.","ru":"Интенсивность на пересечении двух категориальных координат."},"title":{"en":"Matrix heatmap","ru":"Матричная тепловая карта"},"variant":"matrix"},{"family":"waterfall","group":"category","route":"editor_advanced","slug":"waterfall","summary":{"en":"Sequential positive and negative contributions.","ru":"Последовательные положительные и отрицательные вклады."},"title":{"en":"Waterfall","ru":"Каскадная диаграмма"},"variant":"waterfall"},{"family":"funnel_snapshot","group":"flow","route":"editor_advanced","slug":"funnel","summary":{"en":"Ordered stages and decreasing volume.","ru":"Последовательные этапы и уменьшающийся объём."},"title":{"en":"Funnel","ru":"Воронка"},"variant":"snapshot"},{"family":"sankey_status_flow","group":"flow","route":"editor_advanced","slug":"sankey","summary":{"en":"Flows between nodes with link width proportional to volume.","ru":"Потоки между узлами с шириной связей по объёму."},"title":{"en":"Sankey","ru":"Диаграмма потоков"},"variant":"sankey"},{"family":"histogram","group":"distribution","route":"editor_advanced","slug":"histogram","summary":{"en":"Frequencies across precomputed bins.","ru":"Частоты по заранее рассчитанным интервалам."},"title":{"en":"Histogram","ru":"Гистограмма"},"variant":"histogram"},{"family":"box_plot","group":"distribution","route":"editor_advanced","slug":"box-plot","summary":{"en":"Five-number distribution summaries by group.","ru":"Пять числовых характеристик распределения по группам."},"title":{"en":"Box plot","ru":"Диаграмма размаха"},"variant":"box_plot"},{"family":"scatter","group":"relationship","route":"editor_advanced","slug":"scatter","summary":{"en":"Relationship between two numeric measures.","ru":"Связь двух числовых показателей."},"title":{"en":"Scatter plot","ru":"Точечная диаграмма"},"variant":"scatter"},{"family":"bubble","group":"relationship","route":"editor_advanced","slug":"bubble","summary":{"en":"An x/y relationship with a third measure encoded by size.","ru":"Связь x/y с третьим показателем в размере."},"title":{"en":"Bubble chart","ru":"Пузырьковая диаграмма"},"variant":"bubble"},{"family":"pie","group":"part","route":"editor_advanced","slug":"pie","summary":{"en":"Parts of one whole in a circular form.","ru":"Части одного целого в круговой форме."},"title":{"en":"Pie chart","ru":"Круговая диаграмма"},"variant":"pie"},{"family":"donut","group":"part","route":"editor_advanced","slug":"donut","summary":{"en":"Part-to-whole composition with a center total.","ru":"Состав целого с итогом в центре."},"title":{"en":"Donut chart","ru":"Кольцевая диаграмма"},"variant":"donut"},{"family":"treemap","group":"part","route":"editor_advanced","slug":"treemap","summary":{"en":"Rectangle area is proportional to parts of a whole.","ru":"Площадь прямоугольников пропорциональна частям целого."},"title":{"en":"Treemap","ru":"Иерархическая карта"},"variant":"treemap"},{"family":"table_node","group":"table","route":"editor_table","slug":"editor-table","summary":{"en":"A native table with a bar cell and pagination.","ru":"Нативная таблица с bar-ячейкой и пагинацией."},"title":{"en":"Compact table","ru":"Компактная таблица"},"variant":"standard"},{"family":"table_node","group":"table","route":"editor_table","slug":"detail-table","summary":{"en":"Pinned keys, formats, hints, pagination, and horizontal scrolling.","ru":"Закреплённые ключи, форматы, hints, пагинация и горизонтальная прокрутка."},"title":{"en":"Wide detail table","ru":"Широкая детальная таблица"},"variant":"detail"},{"family":"table_node","group":"table","route":"editor_table","slug":"status-table","summary":{"en":"Conditional styling, a safe link, and an explicit empty state.","ru":"Условное оформление, безопасная ссылка и явное пустое состояние."},"title":{"en":"Status table","ru":"Таблица состояний"},"variant":"status"},{"family":"table_node","group":"table","route":"editor_table","slug":"grouped-summary-table","summary":{"en":"Multi-level headers and progress/bar cells.","ru":"Многоуровневые заголовки и progress/bar-ячейки."},"title":{"en":"Grouped summary table","ru":"Сгруппированная сводная таблица"},"variant":"grouped_summary"},{"family":"search_selector","group":"selector","route":"editor_js_control","slug":"search-selector","summary":{"en":"A searchable single select with static options.","ru":"Одиночный выбор с поиском по статическому набору."},"title":{"en":"Search selector","ru":"Поисковый селектор"},"variant":"search"},{"family":"date_range_selector","group":"selector","route":"editor_js_control","slug":"date-range-selector","summary":{"en":"A date range with two explicit parameters.","ru":"Диапазон с двумя явными параметрами."},"title":{"en":"Date range selector","ru":"Диапазон дат"},"variant":"range"},{"family":"selector_family_static","group":"selector","route":"editor_js_control","slug":"static-selector","summary":{"en":"A compact select with explicit options.","ru":"Компактный выбор из явно заданных вариантов."},"title":{"en":"Static selector","ru":"Статический селектор"},"variant":"static"},{"family":"selector_family_dynamic","group":"selector","route":"editor_js_control","slug":"dynamic-selector","summary":{"en":"Options come from a dataset source.","ru":"Варианты поступают из dataset source."},"title":{"en":"Dynamic selector","ru":"Динамический селектор"},"variant":"dynamic"},{"family":"selector_group","group":"selector","route":"editor_js_control","slug":"selector-group","summary":{"en":"A period, static filter, and dynamic dictionary.","ru":"Период, статический фильтр и динамический справочник."},"title":{"en":"Selector group","ru":"Группа селекторов"},"variant":"group"}],"schema_id":"javascript_cookbook","tips":[{"body":{"en":"Copy an object's tabs in the shown order. A normal transfer requires changes only in Meta and Sources; Params, Prepare, Controls, and Config already match the recipe contract.","ru":"Копируйте вкладки объекта в указанном порядке. Для обычного переноса обязательные изменения находятся только в Meta и Sources; Params, Prepare, Controls и Config уже согласованы с контрактом рецепта."},"id":"copy-order","title":{"en":"Which tabs to copy","ru":"Какие вкладки копировать"}},{"body":{"en":"Field names emitted by Sources are the interface between data and Prepare. Map your fields to them, but do not rename aliases unless you intentionally update Prepare too.","ru":"Имена полей после Sources — это интерфейс между данными и Prepare. Сопоставьте с ними свои поля, но не переименовывайте aliases без одновременного осознанного изменения Prepare."},"id":"aliases","title":{"en":"Preserve output aliases","ru":"Сохраните выходные псевдонимы"}},{"body":{"en":"Optional settings live in the CUSTOMIZE block before the protected runtime. Change only values in that block: series labels, palette, number format, units, and tooltip copy.","ru":"Необязательные настройки собраны в блоке CUSTOMIZE перед защищённым runtime. Меняйте только значения этого блока: подписи серий, палитру, формат чисел, единицы и текст tooltip."},"id":"customize","title":{"en":"Labels, colors, units, and tooltip","ru":"Подписи, цвета, единицы и всплывающие подсказки"}},{"body":{"en":"The renderer receives the actual width and height. Narrow cards reduce padding and label density; wide cards show more direct labels. Recheck all three modes after changing fonts or legends.","ru":"Рендер получает фактические width и height. На узкой карточке уменьшаются отступы и плотность подписей; на широкой появляется больше прямых подписей. Проверяйте все три режима после изменения шрифтов или легенды."},"id":"responsive","title":{"en":"Compact, dashboard, and wide","ru":"Компактный, дашборд и широкий режим"}},{"body":{"en":"For wide tables, keep key columns pinned, enable horizontal scrolling, and bound the page with pagination. Do not recreate table_node in Advanced HTML: the native table preserves sorting, cell types, and accessibility.","ru":"Для широких таблиц оставляйте ключевые колонки закреплёнными, включайте горизонтальную прокрутку и ограничивайте страницу пагинацией. Не переносите table_node в Advanced HTML: нативная таблица сохраняет сортировку, типы ячеек и доступность."},"id":"tables","title":{"en":"Wide tables","ru":"Широкие таблицы"}},{"body":{"en":"Send already aggregated rows to a visualization. A dataset is convenient for reuse and field governance; SQL pushdown is useful at larger scale when ClickHouse should filter and aggregate before returning the result.","ru":"Передавайте в визуализацию уже агрегированные строки. Dataset удобен для повторного использования и управления полями; SQL pushdown полезен для больших объёмов, когда фильтрацию и агрегацию выгоднее выполнить в ClickHouse до передачи результата."},"id":"scale","title":{"en":"Data scaling","ru":"Масштабирование данных"}},{"body":{"en":"First compare Sources aliases with the contract and check value types. Then confirm required fields are not null, dates use ISO format, and Params filters still leave rows.","ru":"Сначала сравните aliases в Sources с контрактом и проверьте типы значений. Затем убедитесь, что обязательные поля не null, даты имеют ISO-формат, а фильтры Params действительно оставляют строки."},"id":"diagnostics","title":{"en":"When preview is empty","ru":"Если предпросмотр пустой"}}],"viewports":{"compact":{"height":220,"width":320},"dashboard":{"height":340,"width":640},"wide":{"height":460,"width":960}}}</script>
  <script>(() => {
  'use strict';

  const payload = JSON.parse(document.getElementById('cookbook-data').textContent);
  const base = document.body.dataset.base || './';
  const query = new URLSearchParams(window.location.search);
  const state = {
    lang: query.get('lang') === 'en' ? 'en' : 'ru',
    theme: 'light',
    viewport: 'dashboard',
    tab: '',
    filter: '',
    sourceMode: 'dataset',
    caseObject: '',
  };

  const ui = {
    ru: {
      tips: 'Советы', library: 'Визуализации', cases: 'Кейсы применения',
      subtitle: 'Готовые типизированные рецепты JavaScript для DataLens Editor',
      search: 'Найти визуализацию', preview: 'Интерактивный предпросмотр',
      synthetic: 'Синтетический локальный предпросмотр — не доказательство рендера в опубликованном DataLens',
      useCase: 'Когда использовать', behavior: 'Особенности поведения',
      sourceContract: 'Контракт Sources', alias: 'Alias', meaning: 'Назначение',
      typeFormat: 'Тип / формат', nullBehavior: 'Поведение null', example: 'Пример',
      noSource: 'Внешний источник не требуется.', code: 'Код для DataLens', support: 'Вспомогательные файлы',
      copy: 'Копировать', copied: 'Скопировано', open: 'Открыть исходник', download: 'Скачать',
      markdown: 'Markdown', parameterMap: 'Карта параметров', owner: 'Владелец', readers: 'Читатели',
      type: 'Тип', defaultValue: 'По умолчанию', purpose: 'Назначение', copyOrder: 'Объекты и порядок копирования',
      dataset: 'Dataset', clickhouse: 'ClickHouse', sourceMode: 'Режим Sources',
      emptyLibrary: 'Ничего не найдено', allRecipes: 'Все 34 самостоятельных рецепта',
      linkedCases: 'Три примера, где селекторы, чарты и таблицы используют общие Params.',
      previewError: 'Не удалось построить предпросмотр', object: 'Объект', tabs: 'Вкладки',
      whatChanges: 'Для обычного переноса замените только Meta и Sources. Необязательные настройки находятся в блоке CUSTOMIZE.',
      groups: {kpi: 'Показатели', time: 'Временные ряды', category: 'Сравнение категорий', matrix: 'Матрицы', flow: 'Потоки', distribution: 'Распределения', relationship: 'Связи', part: 'Части целого', table: 'Таблицы', selector: 'Селекторы'},
      viewports: {compact: 'Компактный', dashboard: 'Дашборд', wide: 'Широкий'},
      themes: {light: 'Светлая', dark: 'Тёмная'},
    },
    en: {
      tips: 'Tips', library: 'Visualizations', cases: 'Use cases',
      subtitle: 'Copy-ready typed JavaScript recipes for DataLens Editor',
      search: 'Find a visualization', preview: 'Interactive preview',
      synthetic: 'Synthetic local preview — not proof of rendering in published DataLens',
      useCase: 'When to use it', behavior: 'Specific behavior',
      sourceContract: 'Sources contract', alias: 'Alias', meaning: 'Purpose',
      typeFormat: 'Type / format', nullBehavior: 'Null behavior', example: 'Example',
      noSource: 'No external source is required.', code: 'DataLens code', support: 'Support files',
      copy: 'Copy', copied: 'Copied', open: 'Open source', download: 'Download',
      markdown: 'Markdown', parameterMap: 'Parameter map', owner: 'Owner', readers: 'Readers',
      type: 'Type', defaultValue: 'Default', purpose: 'Purpose', copyOrder: 'Objects and copy order',
      dataset: 'Dataset', clickhouse: 'ClickHouse', sourceMode: 'Sources mode',
      emptyLibrary: 'Nothing found', allRecipes: 'All 34 standalone recipes',
      linkedCases: 'Three examples where selectors, charts, and tables share Params.',
      previewError: 'Preview could not be built', object: 'Object', tabs: 'Tabs',
      whatChanges: 'For a normal transfer, replace only Meta and Sources. Optional settings live in the CUSTOMIZE block.',
      groups: {kpi: 'KPI', time: 'Time series', category: 'Category comparison', matrix: 'Matrices', flow: 'Flows', distribution: 'Distributions', relationship: 'Relationships', part: 'Part to whole', table: 'Tables', selector: 'Selectors'},
      viewports: {compact: 'Compact', dashboard: 'Dashboard', wide: 'Wide'},
      themes: {light: 'Light', dark: 'Dark'},
    },
  };

  function t(key) { return ui[state.lang][key]; }
  function localized(value) { return value && typeof value === 'object' ? value[state.lang] : String(value || ''); }
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function link(path) { return `${base}${path}${path.includes('?') ? '&' : '?'}lang=${state.lang}`; }
  function currentLangUrl() {
    const url = new URL(window.location.href);
    url.searchParams.set('lang', state.lang);
    return url;
  }

  function renderTopbar() {
    document.documentElement.lang = state.lang;
    document.getElementById('topbar').innerHTML = `
      <a class="brand" href="${link('index.html')}">
        <span>JavaScript Visualization Cookbook</span><small>${esc(t('subtitle'))}</small>
      </a>
      <nav class="primary-nav" aria-label="Cookbook">
        <a class="${payload.page_type === 'tips' ? 'is-active' : ''}" href="${link('index.html')}">${esc(t('tips'))}</a>
        <a class="${['library', 'recipe'].includes(payload.page_type) ? 'is-active' : ''}" href="${link('visualizations/index.html')}">${esc(t('library'))}</a>
        <a class="${['cases_index', 'case'].includes(payload.page_type) ? 'is-active' : ''}" href="${link('cases/index.html')}">${esc(t('cases'))}</a>
      </nav>
      <button id="language-toggle" class="language-toggle" type="button">${state.lang === 'ru' ? 'EN' : 'RU'}</button>
    `;
    document.getElementById('language-toggle').addEventListener('click', () => {
      state.lang = state.lang === 'ru' ? 'en' : 'ru';
      window.history.replaceState({}, '', currentLangUrl());
      state.tab = '';
      render();
    });
  }

  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (payload.page_type === 'tips') {
      sidebar.innerHTML = `<div class="side-title">${esc(t('tips'))}</div>${payload.tips.map(item => `<a href="#${esc(item.id)}">${esc(localized(item.title))}</a>`).join('')}`;
      return;
    }
    if (payload.page_type === 'cases_index' || payload.page_type === 'case') {
      sidebar.innerHTML = `<div class="side-title">${esc(t('cases'))}</div>${payload.cases.map(item => `<a class="${payload.case && payload.case.slug === item.slug ? 'is-active' : ''}" href="${link(`cases/${item.slug}/index.html`)}">${esc(localized(item.title))}</a>`).join('')}`;
      return;
    }
    const groups = [...new Set(payload.recipes.map(item => item.group))];
    sidebar.innerHTML = `
      <label class="search"><span class="sr-only">${esc(t('search'))}</span><input id="recipe-search" value="${esc(state.filter)}" placeholder="${esc(t('search'))}"></label>
      <div id="recipe-links"></div>
    `;
    const renderLinks = () => {
      const needle = state.filter.trim().toLowerCase();
      document.getElementById('recipe-links').innerHTML = groups.map(group => {
        const items = payload.recipes.filter(item => item.group === group && (!needle || `${item.family} ${localized(item.title)} ${localized(item.summary)}`.toLowerCase().includes(needle)));
        if (!items.length) return '';
        return `<section class="side-group"><h2>${esc(t('groups')[group] || group)}</h2>${items.map(item => `<a class="${payload.recipe && payload.recipe[state.lang].slug === item.slug ? 'is-active' : ''}" href="${link(`recipes/${item.slug}/index.html`)}"><span>${esc(localized(item.title))}</span><code>${esc(item.family)}</code></a>`).join('')}</section>`;
      }).join('') || `<p class="muted">${esc(t('emptyLibrary'))}</p>`;
    };
    renderLinks();
    document.getElementById('recipe-search').addEventListener('input', event => { state.filter = event.target.value; renderLinks(); });
  }

  function renderTips() {
    document.getElementById('content').innerHTML = `
      <article class="landing"><header class="hero"><span class="kicker">JavaScript Visualization Cookbook</span><h1>${esc(t('tips'))}</h1><p>${esc(t('whatChanges'))}</p></header>
      <div class="tips-grid">${payload.tips.map((item, index) => `<section id="${esc(item.id)}" class="tip-card"><span>${String(index + 1).padStart(2, '0')}</span><h2>${esc(localized(item.title))}</h2><p>${esc(localized(item.body))}</p></section>`).join('')}</div>
      </article>`;
  }

  function renderLibrary() {
    document.getElementById('content').innerHTML = `
      <article class="landing"><header class="hero"><span class="kicker">34</span><h1>${esc(t('library'))}</h1><p>${esc(t('allRecipes'))}</p></header>
      <div class="card-grid">${payload.recipes.map(item => `<a class="catalog-card" href="${link(`recipes/${item.slug}/index.html`)}"><span>${esc(t('groups')[item.group] || item.group)}</span><h2>${esc(localized(item.title))}</h2><p>${esc(localized(item.summary))}</p><code>${esc(item.family)} · ${esc(item.variant)}</code></a>`).join('')}</div></article>`;
  }

  function renderCasesIndex() {
    document.getElementById('content').innerHTML = `
      <article class="landing"><header class="hero"><span class="kicker">3</span><h1>${esc(t('cases'))}</h1><p>${esc(t('linkedCases'))}</p></header>
      <div class="case-list">${payload.cases.map((item, index) => `<a class="case-card" href="${link(`cases/${item.slug}/index.html`)}"><span>0${index + 1}</span><div><h2>${esc(localized(item.title))}</h2><p>${esc(localized(item.summary))}</p><code>${esc(item.kind)}</code></div></a>`).join('')}</div></article>`;
  }

  function sourceTable(fields) {
    if (!fields.length) return `<p class="muted">${esc(t('noSource'))}</p>`;
    return `<div class="table-scroll"><table><thead><tr><th>${esc(t('alias'))}</th><th>${esc(t('meaning'))}</th><th>${esc(t('typeFormat'))}</th><th>${esc(t('nullBehavior'))}</th><th>${esc(t('example'))}</th></tr></thead><tbody>${fields.map(field => `<tr><td><code>${esc(field.alias)}</code><small>${field.nullable ? 'nullable' : 'required'}</small></td><td>${esc(field.meaning)}</td><td><code>${esc(field.type)}</code><br>${esc(field.format)}</td><td>${esc(field.null_behavior)}</td><td><code>${esc(JSON.stringify(field.example))}</code></td></tr>`).join('')}</tbody></table></div>`;
  }

  function fileList(recipe) {
    return [
      ...recipe.tab_order.map(name => ({name, content: recipe.tabs[name], kind: 'tab'})),
      ...Object.entries(recipe.support_files).map(([name, content]) => ({name, content, kind: 'support'})),
    ];
  }

  function renderRecipe() {
    const recipe = payload.recipe[state.lang];
    const files = fileList(recipe);
    if (!state.tab || !files.some(item => item.name === state.tab)) state.tab = files.some(item => item.name === 'sources.js') ? 'sources.js' : files[0].name;
    const current = files.find(item => item.name === state.tab);
    const codePath = `recipes/${recipe.slug}/code/${state.lang}/${current.name}`;
    document.getElementById('content').innerHTML = `
      <article class="recipe"><header class="recipe-header"><div><span class="kicker"><code>${esc(recipe.family)}</code> · ${esc(recipe.variant)} · ${esc(recipe.route)}</span><h1>${esc(recipe.title)}</h1><p>${esc(recipe.summary)}</p></div><a class="outline-button" href="${base}recipes/${esc(recipe.slug)}/README${state.lang === 'en' ? '_en' : ''}.md">${esc(t('markdown'))}</a></header>
      ${previewPanel()}
      <div class="two-column"><section class="info-card"><h2>${esc(t('useCase'))}</h2><p>${esc(recipe.use_case)}</p></section><section class="info-card"><h2>${esc(t('behavior'))}</h2><p>${esc(recipe.behavior)}</p></section></div>
      <section class="section-block"><h2>${esc(t('sourceContract'))}</h2>${sourceTable(recipe.source_contract)}</section>
      <section class="edit-note"><p>${esc(t('whatChanges'))}</p></section>
      <section class="code-section"><div class="section-heading"><h2>${esc(t('code'))}</h2></div>${codeTabs(files, current, codePath)}</section>
      </article>`;
    wirePreviewControls(() => renderRecipe());
    wireCodeControls(files, () => renderRecipe(), current);
    mountRecipePreview(recipe);
  }

  function previewPanel() {

    else if (payload.page_type === 'cases_index') renderCasesIndex();
    else if (payload.page_type === 'recipe') renderRecipe();
    else if (payload.page_type === 'case') renderCase();
  }

  render();
})();
</script>
