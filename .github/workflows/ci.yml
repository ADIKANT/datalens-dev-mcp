name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-acceptance:
    name: Offline acceptance (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Validate release versions
        run: python scripts/release_version.py --check-git --allow-tagged-head

      - name: Run offline acceptance
        run: python -m pytest tests/replacement -q

  distribution:
    name: Build and inspect distribution
    needs: offline-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Audit distribution contents
        run: python scripts/check_public_release.py dist/*.whl dist/*.tar.gz

      - name: Smoke-test the installed wheel from an unrelated directory
        run: |
          python -m venv /tmp/datalens-wheel-smoke
          /tmp/datalens-wheel-smoke/bin/python -m pip install dist/*.whl
          env -u PYTHONPATH /tmp/datalens-wheel-smoke/bin/python scripts/installed_smoke.py

      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datalens-dev-mcp-dist
          path: dist/*
          if-no-files-found: error
