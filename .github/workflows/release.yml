name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install build twine

      - name: Run offline acceptance
        run: python -m pytest tests/replacement -q

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_version.py --check-git --tag "$RELEASE_TAG"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Audit distribution contents
        run: python scripts/check_public_release.py dist/*.whl dist/*.tar.gz

      - name: Smoke-test the installed wheel from an unrelated directory
        run: |
          python -m venv /tmp/datalens-wheel-smoke
          /tmp/datalens-wheel-smoke/bin/python -m pip install dist/*.whl
          env -u PYTHONPATH /tmp/datalens-wheel-smoke/bin/python scripts/installed_smoke.py

      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: datalens-dev-mcp-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --title "datalens-dev-mcp ${GITHUB_REF_NAME}"
