name: JavaScript Cookbook Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cookbook-pages.yml
      - config/javascript_cookbook.json
      - config/javascript_cookbook.schema.json
      - docs/cookbook/**
      - scripts/build_javascript_cookbook.py
      - src/datalens_dev_mcp/editor/**
      - templates/cookbook/**
      - templates/datalens/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify generated cookbook
        run: python3 scripts/build_javascript_cookbook.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload cookbook site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/cookbook

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
