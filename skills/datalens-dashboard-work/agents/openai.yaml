  short_description: Build and verify DataLens dashboards through the task-level MCP workflow.
  default_prompt: Use the DataLens MCP task workflow from the exact dashboard project root. Read the compact execution brief, ask once before a substantial mutation, execute its complete next call, and verify API readbacks before any final read-only Browser QA.
dependencies:
